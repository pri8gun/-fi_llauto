name: Smartsheet Autofill

on:
  schedule:
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Заполнить форму, но НЕ нажимать Submit'
        required: true
        default: true
        type: boolean

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run autofill
        env:
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || false }}
        run: python scripts/autofill.py

      - name: Upload test diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode == true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-mode-diagnostics
          path: |
            test-mode.png
            diagnostic.txt
            diagnostic.html
          if-no-files-found: ignore
